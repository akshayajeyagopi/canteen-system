<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Campus Canteen</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <!-- NAVBAR -->

    <header class="navbar">

        <a href="index.html" class="logo">
            <span class="logo-mark">CC</span>
            <span>Campus Canteen</span>
        </a>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="guest.html">Event Guest</a>
        </nav>

        <div class="nav-actions">
            <a href="signup.html" class="login-btn">
                Create Account
            </a>
        </div>

    </header>


    <!-- LOGIN -->

    <main class="auth-container">

        <div class="auth-card">

            <div class="auth-header">

                <div class="auth-logo">
                    CC
                </div>

                <p class="eyebrow">
                    WELCOME BACK
                </p>

                <h1>Login to your account</h1>

                <p>
                    Order your favourite food without waiting in line.
                </p>

            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        College Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your college email"
                        required
                    >

                </div>


                <div class="form-group">

                    <div class="label-row">

                        <label for="password">
                            Password
                        </label>

                        <a href="#" class="forgot-link">
                            Forgot password?
                        </a>

                    </div>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="remember-row">

                    <label>
                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        Remember me
                    </label>

                </div>


                <button
                    type="submit"
                    class="auth-submit"
                >
                    Login
                </button>

                <p
                    id="loginMessage"
                    class="form-message"
                ></p>

            </form>


            <div class="auth-divider">
                <span>OR</span>
            </div>


            <div class="guest-login">

                <p>
                    Visiting our college for an event?
                </p>

                <a href="guest.html">
                    Continue as Event Guest →
                </a>

            </div>


            <p class="auth-switch">

                Don't have an account?

                <a href="signup.html">
                    Create one
                </a>

            </p>

        </div>

    </main>


    <script src="auth.js"></script>

</body>

</html>
