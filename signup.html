<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | Campus Canteen</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <!-- NAVBAR -->

    <header class="navbar">

        <a href="index.html" class="logo">
            <span class="logo-mark">CC</span>
            <span>Campus Canteen</span>
        </a>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="guest.html">Event Guest</a>
        </nav>

        <div class="nav-actions">

            <a href="login.html" class="login-btn">
                Login
            </a>

        </div>

    </header>


    <!-- SIGNUP -->

    <main class="auth-container">

        <div class="auth-card signup-card">

            <div class="auth-header">

                <div class="auth-logo">
                    CC
                </div>

                <p class="eyebrow">
                    GET STARTED
                </p>

                <h1>Create your account</h1>

                <p>
                    Join the campus canteen and start ordering ahead.
                </p>

            </div>


            <form id="signupForm">


                <!-- NAME -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- REGISTER NUMBER -->

                <div class="form-group">

                    <label for="registerNumber">
                        Register Number
                    </label>

                    <input
                        type="text"
                        id="registerNumber"
                        name="registerNumber"
                        placeholder="Enter your register number"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="signupEmail">
                        College Email
                    </label>

                    <input
                        type="email"
                        id="signupEmail"
                        name="email"
                        placeholder="Enter your college email"
                        required
                    >

                </div>


                <!-- PHONE -->

                <div class="form-group">

                    <label for="phone">
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your mobile number"
                        pattern="[0-9]{10}"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="signupPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="signupPassword"
                        name="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Re-enter your password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- TERMS -->

                <div class="terms-row">

                    <label>

                        <input
                            type="checkbox"
                            id="terms"
                            required
                        >

                        I agree to the
                        <a href="#">terms and conditions</a>

                    </label>

                </div>


                <button
                    type="submit"
                    class="auth-submit"
                >
                    Create Account
                </button>


                <p
                    id="signupMessage"
                    class="form-message"
                ></p>

            </form>


            <p class="auth-switch">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </main>


    <script src="auth.js"></script>

</body>

</html>
